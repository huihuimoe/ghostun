# ghostun configuration. CLI flags override file values.
# Only [global] and the active role section ([entry] or [exit]) are read,
# so one file can be shared across both hosts when passing `entry` or `exit` on the CLI.
# Durations are integer seconds. Store this file with mode 0600.

[global]
# Role when `entry` or `exit` is not passed on the CLI.
mode = "entry"

# Required shared key (64 hex characters). Generate once and copy to both peers:
#   od -An -N32 -tx1 /dev/urandom | tr -d ' \n'
# auth_key = "<64 hexadecimal characters>"

# Outer transport; both peers must use the same value.
# Use "faketcp" for direct paths, or "tcp" when going through a terminating TCP relay.
transport = "faketcp"

# TCP only: unsent write limit in KiB. Consider 128 on >1 Gbit/s links.
# tcp_notsent = 64

# Inner TUN interface name; bind your proxy outbound to this interface.
tun_name = "ghostun0"

# Disable inner IPv6 on the TUN interface.
# no_ipv6 = false

# Inner TUN MTU. Set the same value on both peers when their path MTUs differ.
# tun_mtu = 1460

# Health probe interval and silence timeout before reconnecting.
# ping_interval = 5
# dead_timeout = 15

# Skip automatic nftables and sysctl setup when managing firewall rules yourself.
# no_netfilter = false

[entry]
# Exit outer endpoints and connection count for each endpoint (required in entry mode).
# Failed connections retry with bounded exponential backoff.
remote = [
  { address = "203.0.113.10:443", conns = 4 },
  # { address = "[2001:db8::10]:443", conns = 4 },
]

# Set to "mixed" when connecting only over IPv4 to an Exit with outer_family = "mixed".
# outer_family = "mixed"

# FakeTCP only: starting source port when restricting outer ports in firewall rules.
# base_port = 32768

# Inner TUN addresses on Entry.
# tun_ipv4 = "10.200.0.1/30"
# tun_ipv6 = "fd00:200::1/126"

# Outer path MTU when lower than the NIC MTU (e.g. 1492 on PPPoE, 1420 on cloud VPCs).
# outer_mtu = 1500

# Outer egress network interface (default: from routing table).
# iface = "eth0"

# CPU cores to pin Entry workers to (e.g. "0,1" or "0-3").
# cpus = "0-3"

[exit]
# Outer listen port or IP:PORT (required in exit mode, e.g. 443, "192.0.2.10:443", "[2001:db8::10]:443").
listen = 443

# Outer listen family: "ipv4" (listen only IPv4), "ipv6" (listen only IPv6), or "mixed" (listen both).
# outer_family = "ipv4"

# Omit NAT masquerade when routing inner subnets directly without NAT.
# no_masq = false

# Inner TUN addresses on Exit.
# tun_ipv4 = "10.200.0.2/30"
# tun_ipv6 = "fd00:200::2/126"

# Outer path MTU when lower than the NIC MTU (e.g. 1492 on PPPoE, 1420 on cloud VPCs).
# outer_mtu = 1500

# Outer bind and masquerade network interface (default: from routing table).
# iface = "eth0"

# Candidate CPU cores for Exit workers (e.g. "0,1" or "0-3").
# cpus = "0-3"
