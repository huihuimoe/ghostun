services:
  ghostun-exit:
    image: ghcr.io/huihuimoe/ghostun:latest
    container_name: ghostun-exit
    restart: unless-stopped
    network_mode: host
    # Optional: allow io_uring by disabling this container's seccomp filter.
    # security_opt:
    #   - seccomp=unconfined
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun
    # /proc/sys is read-only here and Docker forbids net.* sysctls with host networking.
    # Enable forwarding on the host first:
    #   sysctl -w net.ipv4.ip_forward=1 net.ipv6.conf.all.forwarding=1
    environment:
      RUST_LOG: info
    volumes:
      - ./exit.toml:/etc/ghostun/config.toml:ro
    command: ["--config", "/etc/ghostun/config.toml"]
    stop_signal: SIGTERM
    stop_grace_period: 10s
