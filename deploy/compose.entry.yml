services:
  ghostun-entry:
    image: ghcr.io/huihuimoe/ghostun:latest
    container_name: ghostun-entry
    restart: unless-stopped
    network_mode: host
    # Optional tun_io_uring=true: use a default-derived profile allowing the three
    # io_uring syscalls; see README. Install the profile beside this Compose file.
    # security_opt:
    #   - seccomp=./seccomp-io-uring.json
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun
    environment:
      RUST_LOG: info
    volumes:
      - ./entry.toml:/etc/ghostun/config.toml:ro
    command: ["--config", "/etc/ghostun/config.toml"]
    stop_signal: SIGTERM
    stop_grace_period: 10s
