services:
  ghostun-entry:
    image: ghcr.io/huihuimoe/ghostun:latest
    container_name: ghostun-entry
    restart: unless-stopped
    network_mode: host
    # Optional: allow io_uring by disabling this container's seccomp filter.
    # security_opt:
    #   - seccomp=unconfined
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun
    environment:
      RUST_LOG: info
    volumes:
      - ./entry.toml:/etc/ghostun/config.toml:ro
    command: ["--config", "/etc/ghostun/config.toml"]
    stop_signal: SIGTERM
    stop_grace_period: 10s
