[package]
name = "ghostun"
version = "0.1.6"
edition = "2021"
description = "L3 tunnel with FakeTCP and relay-compatible TCP transports"
license = "AGPL-3.0-or-later"
readme = "README.md"

[[bin]]
name = "ghostun"
path = "src/main.rs"

[dependencies]
argh = "0.1.19"
libc = "0.2"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1.8"
hmac = "0.13.0"
sha2 = "0.11.1"
getrandom = "0.4.3"
netlink-sys = "0.9"
netlink-packet-core = "0.9"
netlink-packet-route = "0.33"
netlink-packet-netfilter = "0.4"
zerocopy = { version = "0.8", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
