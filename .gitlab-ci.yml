stages: [test, image]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

test:
  stage: test
  interruptible: true
  image: rust:1.99.1-slim-trixie
  variables:
    CARGO_BUILD_JOBS: "2"
    CARGO_INCREMENTAL: "0"
    CARGO_PROFILE_DEV_DEBUG: "0"
    CARGO_PROFILE_TEST_DEBUG: "0"
  script:
    - rustup component add rustfmt clippy
    - bash -n tests/e2e/netns.sh tests/e2e/ipv6-disabled.sh
    - cargo fmt --check
    - cargo clippy --locked --all-targets -- -D warnings
    - cargo test --locked

build-image:
  stage: image
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/'
  script:
    - mkdir -p ~/.docker
    - 'printf ''{"auths":{"%s":{"username":"%s","password":"%s"}}}'' "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" > ~/.docker/config.json'
    - >-
      buildctl-daemonless.sh build
      --frontend dockerfile.v0
      --local context=.
      --local dockerfile=.
      --opt image-resolve-mode=pull
      --opt platform=linux/amd64,linux/arm64
      --output "type=image,name=$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG,push=true"
