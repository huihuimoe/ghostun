name: Test & Release

on:
  push:
    branches: [master]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check test scripts, formatting, lints, and unit tests
        run: |
          bash -n tests/e2e/*.sh
          python3 -c 'import ast, pathlib; [ast.parse(p.read_text()) for p in pathlib.Path("tests/e2e").glob("*.py")]'
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Detect whether network E2E is needed
        id: filter
        if: "!startsWith(github.ref, 'refs/tags/')"
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD -- \
            src Cargo.toml Cargo.lock tests .github/workflows/ci.yml | grep -q .; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping network E2E: no runtime, dependency, test, or CI changes"
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build network test binary and image
        if: steps.filter.outputs.e2e == 'true'
        run: |
          cargo build --release --locked
          sudo docker build -f tests/Dockerfile -t ghostun-e2e .
      - name: Run isolated network tests
        if: steps.filter.outputs.e2e == 'true'
        run: |
          run_suite() {
            local name=$1 cmd=$2 start=$SECONDS
            local out="target/e2e-$name.out"
            mkdir -p target
            if sudo docker run --rm --name "ghostun-e2e-$name" --label ghostun-e2e=1 \
              --privileged --network none \
              -v "$PWD":/src -w /src -e BIN=/src/target/release/ghostun \
              ghostun-e2e -c "$cmd" >"$out" 2>&1; then
              echo "=== PASS: $name ($((SECONDS - start))s) ==="
            else
              echo "=== FAIL: $name ($((SECONDS - start))s) ==="
              cat "$out"
              return 1
            fi
          }
          export -f run_suite
          printf '%s\0' \
            'tcp-ipv4-relay'    'LOG=/tmp/e2e OUTER_FAMILY=ipv4 RELAY=1 bash tests/e2e/tcp.sh' \
            'tcp-ipv6-relay'    'LOG=/tmp/e2e OUTER_FAMILY=ipv6 RELAY=1 bash tests/e2e/tcp.sh' \
            'faketcp-ipv4'      'LOG=/tmp/e2e OUTER_FAMILY=ipv4 bash tests/e2e/netns.sh' \
            'faketcp-ipv6'      'LOG=/tmp/e2e OUTER_FAMILY=ipv6 bash tests/e2e/netns.sh' \
            'tcp-ipv4-direct'   'LOG=/tmp/e2e OUTER_FAMILY=ipv4 RELAY=0 bash tests/e2e/tcp.sh' \
            'tcp-ipv6-direct'   'LOG=/tmp/e2e OUTER_FAMILY=ipv6 RELAY=0 bash tests/e2e/tcp.sh' \
            'noipv6-faketcp'    'LOG=/tmp/e2e TRANSPORT=faketcp bash tests/e2e/ipv6-disabled.sh' \
            'noipv6-tcp'        'LOG=/tmp/e2e TRANSPORT=tcp bash tests/e2e/ipv6-disabled.sh' |
            xargs -0 -n 2 -P 4 bash -ceu 'run_suite "$1" "$2"' _
      - name: Remove network test containers
        if: always() && steps.filter.outputs.e2e == 'true'
        run: |
          sudo docker ps -aq --filter label=ghostun-e2e=1 | xargs -r sudo docker rm -f

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build amd64 and arm64 release binaries
        run: |
          cargo zigbuild --locked --release --target x86_64-unknown-linux-gnu.2.17 --target aarch64-unknown-linux-gnu.2.17
          mkdir -p dist
          install -m 0755 target/x86_64-unknown-linux-gnu/release/ghostun dist/ghostun-linux-amd64
          install -m 0755 target/aarch64-unknown-linux-gnu/release/ghostun dist/ghostun-linux-arm64
          (cd dist && sha256sum ghostun-linux-amd64 ghostun-linux-arm64 > SHA256SUMS)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/ghostun-linux-amd64
            dist/ghostun-linux-arm64
            dist/SHA256SUMS

  build-image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
