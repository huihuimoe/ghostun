name: Test & Release

on:
  push:
    branches: [master]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check test scripts, formatting, lints, and unit tests
        run: |
          bash -n tests/e2e/*.sh
          python3 -c 'import ast, pathlib; [ast.parse(p.read_text()) for p in pathlib.Path("tests/e2e").glob("*.py")]'
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build network test binary and image
        run: |
          cargo build --release --locked
          sudo docker build -f tests/Dockerfile -t ghostun-e2e .
      - name: Run isolated network tests
        run: |
          sudo docker run -d --name ghostun-e2e --privileged --network none \
            -v "$PWD":/src -w /src -e BIN=/src/target/release/ghostun \
            ghostun-e2e -c 'sleep infinity'
          sudo docker exec ghostun-e2e bash -c '
            set -e
            for family in ipv4 ipv6; do
              LOG=/src/target/e2e-faketcp-$family OUTER_FAMILY=$family bash tests/e2e/netns.sh
              for relay in 0 1; do
                LOG=/src/target/e2e-tcp-$family-$relay OUTER_FAMILY=$family RELAY=$relay bash tests/e2e/tcp.sh
              done
            done
            for transport in faketcp tcp; do
              LOG=/src/target/e2e-noipv6-$transport TRANSPORT=$transport bash tests/e2e/ipv6-disabled.sh
            done'
      - name: Remove network test container
        if: always()
        run: |
          if sudo docker container inspect ghostun-e2e >/dev/null 2>&1; then
            sudo docker rm -f ghostun-e2e
          fi

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build amd64 and arm64 release binaries
        run: |
          cargo zigbuild --locked --release --target x86_64-unknown-linux-gnu.2.17 --target aarch64-unknown-linux-gnu.2.17
          mkdir -p dist
          install -m 0755 target/x86_64-unknown-linux-gnu/release/ghostun dist/ghostun-linux-amd64
          install -m 0755 target/aarch64-unknown-linux-gnu/release/ghostun dist/ghostun-linux-arm64
          (cd dist && sha256sum ghostun-linux-amd64 ghostun-linux-arm64 > SHA256SUMS)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/ghostun-linux-amd64
            dist/ghostun-linux-arm64
            dist/SHA256SUMS

  build-image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
