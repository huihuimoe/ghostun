name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check test scripts, formatting, lints, and unit tests
        run: |
          bash -n tests/e2e/*.sh
          python3 -c 'import ast, pathlib; [ast.parse(p.read_text()) for p in pathlib.Path("tests/e2e").glob("*.py")]'
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Detect whether network E2E is needed
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD -- \
            src Cargo.toml Cargo.lock tests .github/workflows/ci.yml | grep -q .; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping network E2E: no runtime, dependency, test, or CI changes"
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build network test binary and image
        if: steps.filter.outputs.e2e == 'true'
        run: |
          cargo build --release --locked
          sudo docker build -f tests/Dockerfile -t ghostun-e2e .
      - name: Run isolated network tests
        if: steps.filter.outputs.e2e == 'true'
        run: |
          run_suite() {
            local name=$1 cmd=$2 start=$SECONDS
            local out="target/e2e-$name.out"
            local security=()
            if [[ $name == faketcp-* ]]; then
              security=(--security-opt "seccomp=$PWD/tests/deny-io-uring.json")
            fi
            mkdir -p target
            if sudo docker run --rm --name "ghostun-e2e-$name" --label ghostun-e2e=1 \
              --privileged --network none \
              "${security[@]}" \
              -v "$PWD":/src -w /src -e BIN=/src/target/release/ghostun \
              ghostun-e2e -c "$cmd" >"$out" 2>&1; then
              echo "=== PASS: $name ($((SECONDS - start))s) ==="
            else
              echo "=== FAIL: $name ($((SECONDS - start))s) ==="
              cat "$out"
              return 1
            fi
          }
          export -f run_suite
          printf '%s\0' \
            'tcp-ipv4-relay'    'LOG=/tmp/e2e OUTER_FAMILY=ipv4 RELAY=1 bash tests/e2e/tcp.sh' \
            'tcp-ipv6-relay'    'LOG=/tmp/e2e OUTER_FAMILY=ipv6 RELAY=1 bash tests/e2e/tcp.sh' \
            'faketcp-ipv4'      'LOG=/src/target/e2e-poll-ipv4 EXPECT_TUN_DRIVER=poll OUTER_FAMILY=ipv4 bash tests/e2e/netns.sh' \
            'faketcp-ipv6'      'LOG=/src/target/e2e-poll-ipv6 EXPECT_TUN_DRIVER=poll OUTER_FAMILY=ipv6 bash tests/e2e/netns.sh' \
            'uring-ipv4'        'LOG=/src/target/e2e-uring-ipv4 EXPECT_TUN_DRIVER=uring OUTER_FAMILY=ipv4 bash tests/e2e/netns.sh' \
            'uring-ipv6'        'LOG=/src/target/e2e-uring-ipv6 EXPECT_TUN_DRIVER=uring OUTER_FAMILY=ipv6 bash tests/e2e/netns.sh' \
            'uring-kernel'      'set -e; for binary in target/debug/deps/ghostun-*; do if [[ -f "$binary" && -x "$binary" ]]; then "$binary" --ignored --exact sys::batch_tests::entry_raw_socket_binds_and_connects_both_families; "$binary" --ignored --exact faketcp::tun::tests::uring_recycles_buffers_and_preserves_backlog_across_runtime_fallback; fi; done' \
            'tcp-ipv4-direct'   'LOG=/tmp/e2e OUTER_FAMILY=ipv4 RELAY=0 bash tests/e2e/tcp.sh' \
            'tcp-ipv6-direct'   'LOG=/tmp/e2e OUTER_FAMILY=ipv6 RELAY=0 bash tests/e2e/tcp.sh' \
            'noipv6-faketcp'    'LOG=/tmp/e2e TRANSPORT=faketcp bash tests/e2e/ipv6-disabled.sh' \
            'noipv6-tcp'        'LOG=/tmp/e2e TRANSPORT=tcp bash tests/e2e/ipv6-disabled.sh' \
            'nftables-atomic'   'set -e; for binary in target/debug/deps/ghostun-*; do if [[ -f "$binary" && -x "$binary" ]]; then "$binary" --ignored --exact netfilter::tests::atomic_table_replacement; fi; done' |
            xargs -0 -n 2 -P 4 bash -ceu 'run_suite "$1" "$2"' _
      - name: Remove network test containers
        if: always() && steps.filter.outputs.e2e == 'true'
        run: |
          sudo docker ps -aq --filter label=ghostun-e2e=1 | xargs -r sudo docker rm -f
