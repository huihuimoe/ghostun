name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.2.0 or v0.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prep.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: prep
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            ver="${INPUT_VERSION#v}"
            if ! printf '%s\n' "${ver}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::Invalid semver version: ${INPUT_VERSION}" >&2
              exit 1
            fi
            tag="v${ver}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::Tag ${tag} already exists" >&2
              exit 1
            fi
            sed -i "0,/^version = \".*\"/s//version = \"${ver}\"/" Cargo.toml
            cargo update --workspace
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git diff --quiet Cargo.toml Cargo.lock; then
              git add Cargo.toml Cargo.lock
              git commit -m "chore(release): ${tag}"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
            git tag -a "${tag}" -m "${tag}"
            git push origin "refs/tags/${tag}"
          else
            tag="${GITHUB_REF_NAME}"
            ver=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')
            if [ "v${ver}" != "${tag}" ]; then
              echo "::error::Tag ${tag} does not match Cargo.toml version v${ver}" >&2
              exit 1
            fi
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  release:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - name: Build amd64 and arm64 release binaries
        env:
          RUSTFLAGS: -C linker=rust-lld
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
          mkdir -p dist
          install -m 0755 target/x86_64-unknown-linux-musl/release/ghostun dist/ghostun-linux-amd64
          install -m 0755 target/aarch64-unknown-linux-musl/release/ghostun dist/ghostun-linux-arm64
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/ghostun-linux-amd64
            dist/ghostun-linux-arm64

  build-image:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(needs.prepare.outputs.tag, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
